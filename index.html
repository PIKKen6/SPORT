<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TitanTrack Mobile</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === VARIABLES THEME MOBILE === */
        :root {
            --primary: #bb86fc;
            --primary-hover: #9d4edd;
            --secondary: #03dac6;
            --accent: #ffb74d;
            --danger: #cf6679;
            --success: #4caf50;
            --bg-color: #121212;
            --surface: #1e1e1e;
            --surface-2: #2c2c2c;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: rgba(255, 255, 255, 0.1);
            --radius-sm: 8px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --nav-height: 65px;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --transition: all 0.25s ease;
        }

        /* === RESET & BASE MOBILE === */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        /* === LAYOUT MOBILE === */
        .top-bar { position: sticky; top: 0; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); z-index: 100; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .top-bar h1 { font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        .main-content { flex: 1; overflow-y: auto; padding: 15px 15px calc(var(--nav-height) + 20px) 15px; }
        
        /* === VUES (ROUTING) === */
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* === COMPOSANTS UI === */
        .card { background: var(--surface); border-radius: var(--radius-md); padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        /* Grille Stats Mobile */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: var(--surface); padding: 15px; border-radius: var(--radius-md); border: 1px solid var(--border); text-align: center; }
        .stat-box h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .stat-box .val { font-size: 1.4rem; font-weight: 700; color: var(--secondary); }

        /* Listes (Historique & Séances) */
        .list-item { background: var(--surface-2); padding: 15px; border-radius: var(--radius-sm); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .list-item-content h4 { color: var(--primary); margin-bottom: 4px; font-size: 1rem; }
        .list-item-content p { color: var(--text-muted); font-size: 0.85rem; }
        
        /* Formulaires adaptables au tactile */
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 10px; }
        .form-row > * { flex: 1; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
        input, select, textarea { width: 100%; height: 48px; padding: 0 15px; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); border-radius: var(--radius-sm); font-size: 1rem; appearance: none; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        textarea { height: auto; padding: 12px 15px; min-height: 80px; resize: none; }

        /* Boutons larges pour les doigts */
        .btn { height: 48px; border: none; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; cursor: pointer; transition: var(--transition); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-danger { background: rgba(207, 102, 121, 0.1); border: 1px solid var(--danger); color: var(--danger); }
        .btn-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); border: none; color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }

        /* === BOTTOM NAVIGATION === */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-height) + var(--safe-area-bottom)); background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: var(--safe-area-bottom); z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-decoration: none; font-size: 0.7rem; gap: 4px; transition: var(--transition); }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { color: var(--primary); }

        /* === MODALS (POP-UPS PLEIN ECRAN) === */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); z-index: 2000; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .modal-overlay.open { transform: translateY(0); }
        .modal-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border); background: var(--surface); padding-bottom: calc(15px + var(--safe-area-bottom)); }

        /* === INTERFACE SEANCE ACTIVE (LE PLAYER) === */
        .active-exercise-card { background: var(--surface); border: 2px solid var(--primary); border-radius: var(--radius-md); padding: 15px; margin-bottom: 20px; }
        .set-row { display: grid; grid-template-columns: 40px 1fr 1fr 1fr 50px; gap: 8px; align-items: center; margin-bottom: 10px; background: var(--bg-color); padding: 8px; border-radius: var(--radius-sm); }
        .set-row input { height: 36px; text-align: center; padding: 0 5px; font-size: 0.9rem; }
        .set-number { font-weight: bold; color: var(--text-muted); text-align: center; }
        .btn-check-set { height: 36px; width: 100%; border-radius: var(--radius-sm); border: none; background: var(--surface-2); color: var(--text-muted); transition: 0.2s; }
        .btn-check-set.done { background: var(--success); color: white; }

        /* === CHRONO FLOTTANT === */
        .floating-timer { position: fixed; bottom: calc(var(--nav-height) + var(--safe-area-bottom) + 15px); right: 15px; background: var(--secondary); color: #000; border-radius: 30px; padding: 10px 20px; font-weight: bold; font-variant-numeric: tabular-nums; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1500; display: none; align-items: center; gap: 10px; }
        .floating-timer.active { display: flex; animation: slideInRight 0.3s ease; }
        
        /* Table Historique Mobile */
        .history-card { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; border-left: 4px solid var(--primary); }
        .history-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .history-date { font-size: 0.8rem; color: var(--text-muted); }
        .history-perf { font-size: 1.1rem; font-weight: bold; }
        
        /* Chart container */
        .chart-wrapper { height: 250px; width: 100%; position: relative; }
        
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <h1><i class="fas fa-dumbbell"></i> TitanTrack</h1>
        <button class="btn-icon" onclick="app.modals.settings.open()"><i class="fas fa-cog"></i></button>
    </div>

    <!-- ZONE PRINCIPALE -->
    <div class="main-content">
        
        <!-- VUE 1 : DASHBOARD -->
        <div id="view-dashboard" class="view active">
            <div class="stats-grid">
                <div class="stat-box">
                    <h3>Séances</h3>
                    <div class="val" id="kpi-sessions">0</div>
                </div>
                <div class="stat-box">
                    <h3>Volume (kg)</h3>
                    <div class="val" id="kpi-volume">0</div>
                </div>
                <div class="stat-box">
                    <h3>Séries</h3>
                    <div class="val" id="kpi-sets">0</div>
                </div>
                <div class="stat-box">
                    <h3>Dernière</h3>
                    <div class="val" id="kpi-last" style="font-size:1.1rem; padding-top:5px;">-</div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="card-title"><i class="fas fa-chart-line" style="color:var(--accent)"></i> Progression 1RM</span>
                    <select id="chart-filter" style="width:120px; height:32px; font-size:0.8rem;" onchange="app.updateChart()">
                        <option value="all">Top 3</option>
                    </select>
                </div>
                <div class="chart-wrapper">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>
        </div>

        <!-- VUE 2 : SEANCES (ROUTINES) -->
        <div id="view-routines" class="view">
            <button class="btn btn-primary" style="margin-bottom: 20px;" onclick="app.modals.routineBuilder.open()">
                <i class="fas fa-plus"></i> Créer une séance type
            </button>
            <div id="routines-list">
                <!-- Rempli par JS -->
            </div>
        </div>

        <!-- VUE 3 : HISTORIQUE -->
        <div id="view-history" class="view">
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><i class="fas fa-history" style="color:var(--success)"></i> Historique récent</span>
                </div>
                <div id="history-feed">
                    <!-- Rempli par JS -->
                </div>
            </div>
        </div>

    </div>

    <!-- NAVIGATION BASSE -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="app.nav.switch('view-dashboard', this)">
            <i class="fas fa-home"></i>
            <span>Accueil</span>
        </div>
        <div class="nav-item" onclick="app.nav.switch('view-routines', this)">
            <i class="fas fa-play-circle"></i>
            <span>Séances</span>
        </div>
        <div class="nav-item" onclick="app.nav.switch('view-history', this)">
            <i class="fas fa-list-alt"></i>
            <span>Historique</span>
        </div>
    </div>

    <!-- === MODALS === -->

    <!-- MODAL : CREER UNE ROUTINE -->
    <div id="modal-routine-builder" class="modal-overlay">
        <div class="modal-header">
            <h2>Nouvelle Séance</h2>
            <button class="btn-icon" onclick="app.modals.routineBuilder.close()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Nom de la séance</label>
                <input type="text" id="rb-name" placeholder="Ex: Haut du corps, Vovinam Leg Day..." required>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <span class="card-title">Exercices de la séance</span>
                </div>
                <div id="rb-exercises-list">
                    <!-- Liste des exos ajoutés -->
                </div>
                
                <div class="form-row" style="margin-top: 15px;">
                    <select id="rb-ex-select" style="flex:2;"></select>
                    <input type="number" id="rb-ex-sets" placeholder="Séries" style="flex:1;" min="1" value="4">
                </div>
                <button class="btn btn-secondary" style="margin-top:10px;" onclick="app.modals.routineBuilder.addExercise()">
                    <i class="fas fa-plus"></i> Ajouter l'exercice
                </button>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" onclick="app.modals.routineBuilder.save()">Sauvegarder la séance</button>
        </div>
    </div>

    <!-- MODAL : LECTEUR DE SEANCE ACTIVE (WORKOUT RUNNER) -->
    <div id="modal-active-workout" class="modal-overlay">
        <div class="modal-header">
            <h2 id="aw-title">Séance en cours</h2>
            <button class="btn-icon" onclick="app.modals.activeWorkout.confirmClose()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="aw-body">
            <!-- Rendu dynamique des cartes d'exercices -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-success" onclick="app.modals.activeWorkout.finishWorkout()">
                <i class="fas fa-check-circle"></i> Terminer et Sauvegarder
            </button>
        </div>
    </div>

    <!-- MODAL : PARAMETRES & EXERCICES PERSOS -->
    <div id="modal-settings" class="modal-overlay">
        <div class="modal-header">
            <h2>Paramètres</h2>
            <button class="btn-icon" onclick="app.modals.settings.close()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="card">
                <div class="card-header"><span class="card-title">Général</span></div>
                <div class="form-group">
                    <label>Temps de repos par défaut (secondes)</label>
                    <input type="number" id="set-rest-time" value="90">
                </div>
                <button class="btn btn-secondary" onclick="app.modals.settings.saveRest()">Mettre à jour le chrono</button>
            </div>

            <div class="card">
                <div class="card-header"><span class="card-title">Ajouter un exercice personnalisé</span></div>
                <div class="form-row">
                    <input type="text" id="set-new-ex" placeholder="Ex: Muscle up">
                    <button class="btn btn-primary" style="width:60px;" onclick="app.modals.settings.addCustomExercise()">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><span class="card-title">Données (JSON)</span></div>
                <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="app.dataManager.export()"><i class="fas fa-download"></i> Sauvegarder (Export)</button>
                <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()"><i class="fas fa-upload"></i> Restaurer (Import)</button>
                <input type="file" id="import-file" style="display:none;" accept=".json" onchange="app.dataManager.import(event)">
                
                <button class="btn btn-danger" style="margin-top:30px;" onclick="app.dataManager.clearAll()">
                    <i class="fas fa-trash"></i> Effacer toutes les données
                </button>
            </div>
        </div>
    </div>

    <!-- CHRONOMETRE FLOTTANT -->
    <div id="floating-timer" class="floating-timer" onclick="app.timer.toggle()">
        <i class="fas fa-stopwatch"></i> <span id="ft-display">01:30</span>
    </div>

    <script>
        /**
         * TitanTrack Mobile - Logique Principale
         */
        const app = {
            state: {
                history: [],
                routines: [],
                customExercises: [],
                settings: { restTime: 90 }
            },
            
            // Base de données par défaut (incluant Vovinam)
            dbExercises: [
                "Développé couché", "Squat", "Soulevé de terre", "Développé militaire",
                "Traction", "Rowing barre", "Presse à cuisses", "Fentes bulgares",
                "Curl biceps", "Extension triceps", "Dips", "Crunch", "Planche lestée",
                "Ciseaux Vovinam", "Coups de pied sautés", "Shadow Boxing lesté",
                "Arraché (Snatch)", "Épaulé-jeté", "Power Clean"
            ],

            chartInstance: null,
            timerInterval: null,
            timeLeft: 0,

            // --- INITIALISATION ---
            init: function() {
                this.loadData();
                this.ensureDefaultRoutines();
                this.nav.init();
                this.updateUI();
                this.initChart();
            },

            loadData: function() {
                const stored = localStorage.getItem('titantrack_mobile_data');
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        this.state.history = parsed.history || [];
                        this.state.routines = parsed.routines || [];
                        this.state.customExercises = parsed.customExercises || [];
                        this.state.settings = parsed.settings || { restTime: 90 };
                    } catch (e) { console.error("Erreur lecture données locales", e); }
                }
            },

            saveData: function() {
                localStorage.setItem('titantrack_mobile_data', JSON.stringify(this.state));
            },

            ensureDefaultRoutines: function() {
                if (this.state.routines.length === 0) {
                    this.state.routines.push({
                        id: 'default_1',
                        name: 'Préparation Physique Vovinam',
                        exercises: [
                            { name: 'Squat', sets: 4 },
                            { name: 'Ciseaux Vovinam', sets: 3 },
                            { name: 'Coups de pied sautés', sets: 3 },
                            { name: 'Traction', sets: 3 }
                        ]
                    });
                    this.state.routines.push({
                        id: 'default_2',
                        name: 'Force Globale (Full Body)',
                        exercises: [
                            { name: 'Soulevé de terre', sets: 4 },
                            { name: 'Développé couché', sets: 4 },
                            { name: 'Rowing barre', sets: 4 }
                        ]
                    });
                    this.saveData();
                }
            },

            getAllExercises: function() {
                const all = new Set([...this.dbExercises, ...this.state.customExercises]);
                return Array.from(all).sort();
            },

            // --- NAVIGATION (ONGLETS) ---
            nav: {
                init: function() {
                    // Pré-remplir les listes déroulantes d'exercices
                    app.ui.populateExerciseSelects();
                },
                switch: function(viewId, navElement) {
                    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    
                    document.getElementById(viewId).classList.add('active');
                    navElement.classList.add('active');

                    if(viewId === 'view-dashboard') app.updateChart();
                }
            },

            // --- GESTION DE L'INTERFACE UI ---
            ui: {
                populateExerciseSelects: function() {
                    const select = document.getElementById('rb-ex-select');
                    select.innerHTML = '';
                    app.getAllExercises().forEach(ex => {
                        const opt = document.createElement('option');
                        opt.value = ex;
                        opt.textContent = ex;
                        select.appendChild(opt);
                    });
                },

                renderDashboard: function() {
                    const uniqueDates = new Set(app.state.history.map(h => h.date));
                    document.getElementById('kpi-sessions').textContent = uniqueDates.size;

                    const vol = app.state.history.reduce((sum, item) => sum + (item.weight * item.reps * item.sets), 0);
                    document.getElementById('kpi-volume').textContent = vol.toLocaleString('fr-FR');

                    const sets = app.state.history.reduce((sum, item) => sum + item.sets, 0);
                    document.getElementById('kpi-sets').textContent = sets;

                    if (uniqueDates.size > 0) {
                        const sorted = Array.from(uniqueDates).sort((a,b) => new Date(b) - new Date(a));
                        const d = new Date(sorted[0]);
                        document.getElementById('kpi-last').textContent = `${d.getDate()}/${d.getMonth()+1}`;
                    }
                },

                renderRoutines: function() {
                    const container = document.getElementById('routines-list');
                    container.innerHTML = '';
                    app.state.routines.forEach(rt => {
                        const exSummary = rt.exercises.map(e => e.name).join(', ').substring(0, 40) + '...';
                        container.innerHTML += `
                            <div class="list-item" onclick="app.modals.activeWorkout.open('${rt.id}')">
                                <div class="list-item-content">
                                    <h4>${rt.name}</h4>
                                    <p>${rt.exercises.length} exercices | ${exSummary}</p>
                                </div>
                                <i class="fas fa-play" style="color:var(--primary); font-size:1.5rem;"></i>
                            </div>
                        `;
                    });
                },

                renderHistory: function() {
                    const container = document.getElementById('history-feed');
                    container.innerHTML = '';
                    
                    const recent = [...app.state.history].sort((a,b) => b.timestamp - a.timestamp).slice(0, 30);
                    
                    if (recent.length === 0) {
                        container.innerHTML = '<p style="color:var(--text-muted); text-align:center;">Aucune série enregistrée.</p>';
                        return;
                    }

                    recent.forEach(item => {
                        const d = new Date(item.date);
                        container.innerHTML += `
                            <div class="history-card">
                                <div class="history-header">
                                    <span class="history-date">${d.getDate().toString().padStart(2,'0')}/${(d.getMonth()+1).toString().padStart(2,'0')} - ${item.exercise}</span>
                                    <button style="background:none; border:none; color:var(--danger); padding:0 5px;" onclick="app.dataManager.deleteRecord('${item.id}')">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </div>
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <span class="history-perf">${item.sets} x ${item.reps} @ ${item.weight}kg</span>
                                    <span style="font-size:0.8rem; background:rgba(255,255,255,0.1); padding:2px 6px; border-radius:4px;">RPE ${item.rpe || '-'}</span>
                                </div>
                            </div>
                        `;
                    });
                }
            },

            updateUI: function() {
                this.ui.renderDashboard();
                this.ui.renderRoutines();
                this.ui.renderHistory();
                this.ui.populateExerciseSelects();
                
                // Maj filtre chart
                const filter = document.getElementById('chart-filter');
                const curr = filter.value;
                const exos = Array.from(new Set(this.state.history.map(h => h.exercise))).sort();
                filter.innerHTML = '<option value="all">Top 3</option>';
                exos.forEach(ex => {
                    filter.innerHTML += `<option value="${ex}">${ex}</option>`;
                });
                if(exos.includes(curr)) filter.value = curr;
            },

            // --- MODALS / WORKFLOWS ---
            modals: {
                // Constructeur de routine
                routineBuilder: {
                    tempExercises: [],
                    open: function() {
                        this.tempExercises = [];
                        document.getElementById('rb-name').value = '';
                        this.renderList();
                        document.getElementById('modal-routine-builder').classList.add('open');
                    },
                    close: function() {
                        document.getElementById('modal-routine-builder').classList.remove('open');
                    },
                    addExercise: function() {
                        const name = document.getElementById('rb-ex-select').value;
                        const sets = parseInt(document.getElementById('rb-ex-sets').value) || 4;
                        if(name) {
                            this.tempExercises.push({ name, sets });
                            this.renderList();
                        }
                    },
                    removeExercise: function(idx) {
                        this.tempExercises.splice(idx, 1);
                        this.renderList();
                    },
                    renderList: function() {
                        const html = this.tempExercises.map((ex, i) => `
                            <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
                                <span>${ex.name} (${ex.sets} séries)</span>
                                <i class="fas fa-times" style="color:var(--danger);" onclick="app.modals.routineBuilder.removeExercise(${i})"></i>
                            </div>
                        `).join('');
                        document.getElementById('rb-exercises-list').innerHTML = html;
                    },
                    save: function() {
                        const name = document.getElementById('rb-name').value.trim();
                        if (!name || this.tempExercises.length === 0) return alert('Nom et au moins 1 exercice requis.');
                        
                        app.state.routines.push({
                            id: 'rt_' + Date.now(),
                            name: name,
                            exercises: [...this.tempExercises]
                        });
                        app.saveData();
                        app.updateUI();
                        this.close();
                    }
                },

                // Lancement d'une séance (Le Player)
                activeWorkout: {
                    currentRoutine: null,
                    sessionData: [], // Stock temporairement les séries validées
                    open: function(routineId) {
                        this.currentRoutine = app.state.routines.find(r => r.id === routineId);
                        this.sessionData = [];
                        document.getElementById('aw-title').textContent = this.currentRoutine.name;
                        this.renderRunner();
                        document.getElementById('modal-active-workout').classList.add('open');
                    },
                    confirmClose: function() {
                        if(confirm("Quitter la séance en cours ? Les données non sauvegardées seront perdues.")) {
                            document.getElementById('modal-active-workout').classList.remove('open');
                        }
                    },
                    renderRunner: function() {
                        const container = document.getElementById('aw-body');
                        container.innerHTML = '';

                        this.currentRoutine.exercises.forEach((ex, exIdx) => {
                            let rowsHtml = '';
                            // Préparer les lignes pour les séries cibles
                            for(let i=0; i<ex.sets; i++) {
                                rowsHtml += `
                                    <div class="set-row" id="row-${exIdx}-${i}">
                                        <div class="set-number">${i+1}</div>
                                        <input type="number" placeholder="kg" id="w-${exIdx}-${i}">
                                        <input type="number" placeholder="reps" id="r-${exIdx}-${i}">
                                        <input type="number" placeholder="rpe" id="rpe-${exIdx}-${i}">
                                        <button class="btn-check-set" onclick="app.modals.activeWorkout.checkSet(${exIdx}, ${i}, '${ex.name}')">
                                            <i class="fas fa-check"></i>
                                        </button>
                                    </div>
                                `;
                            }

                            container.innerHTML += `
                                <div class="active-exercise-card">
                                    <h3 style="margin-bottom: 10px; color:var(--primary);">${ex.name}</h3>
                                    <div style="font-size:0.8rem; color:var(--text-muted); display:grid; grid-template-columns:40px 1fr 1fr 1fr 50px; gap:8px; margin-bottom:5px; text-align:center;">
                                        <span>Set</span><span>Kg</span><span>Reps</span><span>RPE</span><span></span>
                                    </div>
                                    ${rowsHtml}
                                </div>
                            `;
                        });
                    },
                    checkSet: function(exIdx, setIdx, exerciseName) {
                        const weight = parseFloat(document.getElementById(`w-${exIdx}-${setIdx}`).value);
                        const reps = parseInt(document.getElementById(`r-${exIdx}-${setIdx}`).value);
                        const rpe = parseInt(document.getElementById(`rpe-${exIdx}-${setIdx}`).value) || null;
                        
                        if(isNaN(weight) || isNaN(reps)) {
                            return alert("Veuillez saisir le poids et les répétitions.");
                        }

                        // Sauvegarde dans le buffer
                        this.sessionData.push({
                            id: 'set_' + Date.now() + Math.random().toString(16).slice(2),
                            date: new Date().toISOString().split('T')[0],
                            timestamp: Date.now(),
                            exercise: exerciseName,
                            sets: 1, // Chaque ligne compte comme 1 série individuelle
                            reps: reps,
                            weight: weight,
                            rpe: rpe
                        });

                        // UI Update
                        const btn = document.querySelector(`#row-${exIdx}-${setIdx} .btn-check-set`);
                        btn.classList.add('done');
                        btn.innerHTML = '<i class="fas fa-check-double"></i>';
                        btn.disabled = true; // Empêche le double clic

                        // Lancer le chrono
                        app.timer.start();
                    },
                    finishWorkout: function() {
                        if(this.sessionData.length === 0) {
                            alert("Aucune série validée.");
                            return;
                        }
                        
                        // Push all buffer to main history
                        app.state.history.push(...this.sessionData);
                        app.saveData();
                        app.updateUI();
                        
                        document.getElementById('modal-active-workout').classList.remove('open');
                        app.nav.switch('view-dashboard', document.querySelector('.nav-item')); // retour accueil
                        app.timer.stop();
                    }
                },

                // Paramètres
                settings: {
                    open: function() {
                        document.getElementById('set-rest-time').value = app.state.settings.restTime;
                        document.getElementById('modal-settings').classList.add('open');
                    },
                    close: function() { document.getElementById('modal-settings').classList.remove('open'); },
                    saveRest: function() {
                        app.state.settings.restTime = parseInt(document.getElementById('set-rest-time').value) || 90;
                        app.saveData();
                        alert("Chrono mis à jour !");
                    },
                    addCustomExercise: function() {
                        const val = document.getElementById('set-new-ex').value.trim();
                        if(val && !app.state.customExercises.includes(val)) {
                            app.state.customExercises.push(val);
                            app.saveData();
                            app.ui.populateExerciseSelects();
                            document.getElementById('set-new-ex').value = '';
                            alert("Exercice ajouté !");
                        }
                    }
                }
            },

            // --- CHRONOMETRE FLOTTANT ---
            timer: {
                start: function() {
                    const timerEl = document.getElementById('floating-timer');
                    const display = document.getElementById('ft-display');
                    
                    app.timeLeft = app.state.settings.restTime;
                    timerEl.classList.add('active');
                    timerEl.style.background = 'var(--secondary)';
                    
                    if(app.timerInterval) clearInterval(app.timerInterval);
                    
                    const updateDisplay = () => {
                        const m = Math.floor(app.timeLeft / 60).toString().padStart(2, '0');
                        const s = (app.timeLeft % 60).toString().padStart(2, '0');
                        display.textContent = `${m}:${s}`;
                    };
                    updateDisplay();

                    app.timerInterval = setInterval(() => {
                        app.timeLeft--;
                        updateDisplay();
                        
                        if(app.timeLeft <= 10) timerEl.style.background = 'var(--accent)';
                        if(app.timeLeft <= 0) {
                            clearInterval(app.timerInterval);
                            timerEl.style.background = 'var(--success)';
                            display.textContent = "GO!";
                            // Bip sonore si possible
                            try {
                                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                                const osc = ctx.createOscillator();
                                osc.connect(ctx.destination);
                                osc.frequency.value = 600;
                                osc.start();
                                osc.stop(ctx.currentTime + 0.5);
                            } catch(e) {}
                            
                            setTimeout(() => timerEl.classList.remove('active'), 3000);
                        }
                    }, 1000);
                },
                stop: function() {
                    if(app.timerInterval) clearInterval(app.timerInterval);
                    document.getElementById('floating-timer').classList.remove('active');
                },
                toggle: function() {
                    // Clic sur le chrono = ajout/retrait temps ou stop
                    if(app.timeLeft > 0) {
                        app.timeLeft += 30; // Ajoute 30s
                    } else {
                        this.stop();
                    }
                }
            },

            // --- GRAPHIQUE (CHART.JS) ---
            initChart: function() {
                const ctx = document.getElementById('mainChart').getContext('2d');
                Chart.defaults.color = 'var(--text-muted)';
                Chart.defaults.font.family = "-apple-system, sans-serif";

                this.chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [] },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        plugins: { legend: { position: 'top', labels: { boxWidth: 8, font: {size: 10} } } },
                        scales: {
                            x: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { font: {size: 9} } },
                            y: { grid: { color: 'rgba(255, 255, 255, 0.05)' }, ticks: { font: {size: 9} } }
                        },
                        tension: 0.3
                    }
                });
                this.updateChart();
            },
            
            updateChart: function() {
                if(!this.chartInstance) return;
                const filterVal = document.getElementById('chart-filter').value;
                
                // Group by date, calculate daily max 1RM
                const sorted = [...this.state.history].sort((a,b) => new Date(a.date) - new Date(b.date));
                const allDates = Array.from(new Set(sorted.map(h => h.date)));
                
                let datasets = [];
                const colors = ['#bb86fc', '#03dac6', '#ffb74d'];

                const calc1RM = (w, r) => w * (36 / (37 - r));

                const buildDataset = (exName, colorIndex) => {
                    const dataPoints = allDates.map(d => {
                        const entries = sorted.filter(x => x.date === d && x.exercise === exName);
                        if(entries.length === 0) return null;
                        return Math.max(...entries.map(e => calc1RM(e.weight, e.reps))).toFixed(1);
                    });
                    return {
                        label: exName,
                        data: dataPoints,
                        borderColor: colors[colorIndex],
                        backgroundColor: colors[colorIndex],
                        borderWidth: 2,
                        pointRadius: 3,
                        spanGaps: true
                    };
                };

                if(filterVal === 'all') {
                    // Find top 3 exercises
                    const counts = {};
                    sorted.forEach(s => counts[s.exercise] = (counts[s.exercise]||0)+1);
                    const topEx = Object.keys(counts).sort((a,b) => counts[b] - counts[a]).slice(0,3);
                    topEx.forEach((ex, i) => datasets.push(buildDataset(ex, i)));
                } else {
                    datasets.push(buildDataset(filterVal, 0));
                }

                this.chartInstance.data.labels = allDates.map(d => {
                    const dt = new Date(d);
                    return `${dt.getDate()}/${dt.getMonth()+1}`;
                });
                this.chartInstance.data.datasets = datasets;
                this.chartInstance.update();
            },

            // --- GESTION DES DONNEES LOCALES ---
            dataManager: {
                deleteRecord: function(id) {
                    if(confirm("Supprimer cette série ?")) {
                        app.state.history = app.state.history.filter(h => h.id !== id);
                        app.saveData();
                        app.updateUI();
                    }
                },
                clearAll: function() {
                    if(confirm("Vraiment tout supprimer ? Action irréversible.")) {
                        app.state = { history: [], routines: [], customExercises: [], settings: {restTime: 90} };
                        app.ensureDefaultRoutines();
                        app.updateUI();
                        app.modals.settings.close();
                    }
                },
                export: function() {
                    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(app.state));
                    const node = document.createElement('a');
                    node.setAttribute("href", dataStr);
                    node.setAttribute("download", `titantrack_mobile_${new Date().toISOString().split('T')[0]}.json`);
                    node.click();
                },
                import: function(e) {
                    const file = e.target.files[0];
                    if(!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        try {
                            const data = JSON.parse(ev.target.result);
                            if(data.history && data.routines) {
                                app.state = data;
                                app.saveData();
                                app.updateUI();
                                alert("Restauration réussie !");
                            } else { alert("Format invalide."); }
                        } catch(err) { alert("Erreur fichier."); }
                    };
                    reader.readAsText(file);
                }
            }
        };

        // Lancement au chargement
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
