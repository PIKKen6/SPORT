<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TitanTrack Pro - Smart Workout</title>
    <link rel="icon" type="image/png" href="icon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* === VARIABLES THEME === */
        :root {
            --primary: #bb86fc;
            --primary-hover: #9d4edd;
            --secondary: #03dac6;
            --accent: #ffb74d;
            --danger: #cf6679;
            --success: #4caf50;
            --bg-color: #121212;
            --surface: #1e1e1e;
            --surface-2: #2c2c2c;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: rgba(255, 255, 255, 0.1);
            --radius-sm: 8px;
            --radius-md: 16px;
            --nav-height: 65px;
            --safe-area-bottom: env(safe-area-inset-bottom, 0px);
            --transition: all 0.25s ease;
        }

        /* === RESET & BASE === */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); overflow-x: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        /* === LAYOUT === */
        .top-bar { position: sticky; top: 0; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); z-index: 100; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        .top-bar h1 { font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .main-content { flex: 1; overflow-y: auto; padding: 15px 15px calc(var(--nav-height) + 20px) 15px; }
        
        .view { display: none; animation: fadeIn 0.3s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* === COMPOSANTS UI === */
        .card { background: var(--surface); border-radius: var(--radius-md); padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); box-shadow: 0 4px 6px rgba(0,0,0,0.2); }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .card-title { font-size: 1.1rem; font-weight: 600; display: flex; align-items: center; gap: 8px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box { background: var(--surface); padding: 15px; border-radius: var(--radius-md); border: 1px solid var(--border); text-align: center; }
        .stat-box h3 { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 5px; }
        .stat-box .val { font-size: 1.4rem; font-weight: 700; color: var(--secondary); }

        .list-item { background: var(--surface-2); padding: 15px; border-radius: var(--radius-sm); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .list-item-content h4 { color: var(--primary); margin-bottom: 4px; font-size: 1rem; }
        .list-item-content p { color: var(--text-muted); font-size: 0.85rem; }
        
        .form-group { margin-bottom: 15px; }
        .form-row { display: flex; gap: 10px; }
        .form-row > * { flex: 1; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); }
        input, select { width: 100%; height: 48px; padding: 0 15px; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-main); border-radius: var(--radius-sm); font-size: 1rem; appearance: none; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        .btn { height: 48px; border: none; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; cursor: pointer; transition: var(--transition); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-icon { width: 40px; height: 40px; border-radius: 50%; background: var(--surface-2); border: none; color: var(--text-main); display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }

        /* === BOTTOM NAVIGATION === */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: calc(var(--nav-height) + var(--safe-area-bottom)); background: rgba(30, 30, 30, 0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: var(--safe-area-bottom); z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 0.7rem; gap: 4px; transition: var(--transition); }
        .nav-item i { font-size: 1.3rem; }
        .nav-item.active { color: var(--primary); }

        /* === MODALS === */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg-color); z-index: 2000; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .modal-overlay.open { transform: translateY(0); }
        .modal-header { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: var(--surface); }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid var(--border); background: var(--surface); padding-bottom: calc(15px + var(--safe-area-bottom)); }

        /* === INTERFACE SEANCE ACTIVE === */
        .active-exercise-card { background: var(--surface); border: 2px solid var(--primary); border-radius: var(--radius-md); padding: 15px; margin-bottom: 20px; }
        .exercise-hints { background: rgba(255,255,255,0.05); padding: 10px; border-radius: var(--radius-sm); margin-bottom: 12px; font-size: 0.85rem; border-left: 3px solid var(--accent); }
        .exercise-hints strong { color: var(--accent); }
        .set-row { display: grid; grid-template-columns: 35px 1fr 1fr 1fr 45px; gap: 8px; align-items: center; margin-bottom: 10px; background: var(--bg-color); padding: 8px; border-radius: var(--radius-sm); }
        .set-row input { height: 36px; text-align: center; padding: 0 5px; font-size: 0.9rem; }
        .set-number { font-weight: bold; color: var(--text-muted); text-align: center; }
        .btn-check-set { height: 36px; width: 100%; border-radius: var(--radius-sm); border: none; background: var(--surface-2); color: var(--text-muted); transition: 0.2s; }
        .btn-check-set.done { background: var(--success); color: white; }

        /* === CHRONO FLOTTANT === */
        .floating-timer { position: fixed; bottom: calc(var(--nav-height) + var(--safe-area-bottom) + 15px); right: 15px; background: var(--secondary); color: #000; border-radius: 30px; padding: 10px 20px; font-weight: bold; font-variant-numeric: tabular-nums; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 1500; display: none; align-items: center; gap: 10px; cursor: pointer; }
        .floating-timer.active { display: flex; animation: slideInRight 0.3s ease; }
        
        .history-card { background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 12px; border-left: 4px solid var(--primary); }
        .history-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        .history-date { font-size: 0.8rem; color: var(--text-muted); }
        .chart-wrapper { height: 250px; width: 100%; position: relative; }
        
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
    </style>
</head>
<body>

    <div class="top-bar">
        <h1><i class="fas fa-dumbbell"></i> TitanTrack</h1>
        <button class="btn-icon" onclick="app.modals.settings.open()"><i class="fas fa-cog"></i></button>
    </div>

    <div class="main-content">
        <!-- VUE 1 : DASHBOARD -->
        <div id="view-dashboard" class="view active">
            <div class="stats-grid">
                <div class="stat-box">
                    <h3>Séances</h3>
                    <div class="val" id="kpi-sessions">0</div>
                </div>
                <div class="stat-box">
                    <h3>Volume (kg)</h3>
                    <div class="val" id="kpi-volume">0</div>
                </div>
            </div>
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><i class="fas fa-chart-line" style="color:var(--accent)"></i> Progression 1RM</span>
                    <select id="chart-filter" style="width:120px; height:32px; font-size:0.8rem;" onchange="app.updateChart()">
                        <option value="all">Top 3</option>
                    </select>
                </div>
                <div class="chart-wrapper">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>
        </div>

        <!-- VUE 2 : SEANCES -->
        <div id="view-routines" class="view">
            <button class="btn btn-primary" style="margin-bottom: 20px;" onclick="app.modals.routineBuilder.open()">
                <i class="fas fa-plus"></i> Créer une séance
            </button>
            <div id="routines-list"></div>
        </div>

        <!-- VUE 3 : HISTORIQUE -->
        <div id="view-history" class="view">
            <div class="card">
                <div class="card-header">
                    <span class="card-title"><i class="fas fa-history" style="color:var(--success)"></i> Historique récent</span>
                </div>
                <div id="history-feed"></div>
            </div>
        </div>
    </div>

    <!-- NAVIGATION BASSE -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="app.nav.switch('view-dashboard', this)">
            <i class="fas fa-home"></i><span>Accueil</span>
        </div>
        <div class="nav-item" onclick="app.nav.switch('view-routines', this)">
            <i class="fas fa-play-circle"></i><span>Séances</span>
        </div>
        <div class="nav-item" onclick="app.nav.switch('view-history', this)">
            <i class="fas fa-list-alt"></i><span>Historique</span>
        </div>
    </div>

    <!-- === MODALS === -->

    <!-- MODAL CREATION ROUTINE -->
    <div id="modal-routine-builder" class="modal-overlay">
        <div class="modal-header">
            <h2>Nouvelle Séance</h2>
            <button class="btn-icon" onclick="app.modals.routineBuilder.close()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Nom de la séance</label>
                <input type="text" id="rb-name" placeholder="Ex: Push Day, Vovinam..." required>
            </div>
            
            <div class="card">
                <div class="card-header"><span class="card-title">Exercices</span></div>
                <div id="rb-exercises-list"></div>
                
                <div class="form-group" style="margin-top: 15px;">
                    <label>Exercice</label>
                    <select id="rb-ex-select"></select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Séries</label>
                        <input type="number" id="rb-ex-sets" value="4" min="1">
                    </div>
                    <div class="form-group">
                        <label>Reps cibles</label>
                        <input type="number" id="rb-ex-targetreps" value="10" min="1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Repos Séries (s)</label>
                        <input type="number" id="rb-ex-restsets" value="90" step="15">
                    </div>
                    <div class="form-group">
                        <label>Repos final (s)</label>
                        <input type="number" id="rb-ex-restex" value="120" step="15">
                    </div>
                </div>
                <button class="btn btn-secondary" onclick="app.modals.routineBuilder.addExercise()">
                    <i class="fas fa-plus"></i> Ajouter cet exercice
                </button>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" onclick="app.modals.routineBuilder.save()">Sauvegarder</button>
        </div>
    </div>

    <!-- MODAL LECTEUR WORKOUT -->
    <div id="modal-active-workout" class="modal-overlay">
        <div class="modal-header">
            <h2 id="aw-title">Séance en cours</h2>
            <button class="btn-icon" onclick="app.modals.activeWorkout.confirmClose()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body" id="aw-body"></div>
        <div class="modal-footer">
            <button class="btn btn-success" onclick="app.modals.activeWorkout.finishWorkout()">
                <i class="fas fa-check-circle"></i> Terminer la séance
            </button>
        </div>
    </div>

    <!-- MODAL SETTINGS -->
    <div id="modal-settings" class="modal-overlay">
        <div class="modal-header">
            <h2>Paramètres</h2>
            <button class="btn-icon" onclick="app.modals.settings.close()"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="card">
                <div class="card-header"><span class="card-title">Données JSON</span></div>
                <button class="btn btn-secondary" style="margin-bottom:10px;" onclick="app.dataManager.export()"><i class="fas fa-download"></i> Sauvegarder</button>
                <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()"><i class="fas fa-upload"></i> Restaurer</button>
                <input type="file" id="import-file" style="display:none;" accept=".json" onchange="app.dataManager.import(event)">
                <button class="btn" style="background:var(--danger); color:white; margin-top:20px;" onclick="app.dataManager.clearAll()">Effacer tout</button>
            </div>
        </div>
    </div>

    <!-- CHRONO FLOTTANT -->
    <div id="floating-timer" class="floating-timer" onclick="app.timer.toggle()">
        <i class="fas fa-stopwatch"></i> <span id="ft-display">00:00</span>
    </div>

    <script>
        const app = {
            state: {
                history: [],
                routines: [],
                customExercises: [],
            },
            
            dbExercises: [
                "Développé couché", "Squat", "Soulevé de terre", "Développé militaire",
                "Traction", "Rowing barre", "Presse à cuisses", "Curl biceps",
                "Ciseaux Vovinam", "Coups de pied sautés", "Arraché (Snatch)", "Épaulé-jeté"
            ],
            
            timerInterval: null,
            timeLeft: 0,
            chartInstance: null,

            init: function() {
                this.loadData();
                this.ensureDefaultRoutines();
                this.nav.init();
                this.updateUI();
                this.initChart();
            },

            loadData: function() {
                const stored = localStorage.getItem('titantrack_smart_data');
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        this.state = Object.assign(this.state, parsed);
                    } catch (e) {}
                }
            },

            saveData: function() {
                localStorage.setItem('titantrack_smart_data', JSON.stringify(this.state));
            },

            ensureDefaultRoutines: function() {
                if (this.state.routines.length === 0) {
                    this.state.routines.push({
                        id: 'def_1',
                        name: 'Full Body Standard',
                        exercises: [
                            { name: 'Squat', sets: 4, targetReps: 10, restSets: 90, restExercise: 120 },
                            { name: 'Développé couché', sets: 4, targetReps: 8, restSets: 90, restExercise: 120 }
                        ]
                    });
                    this.saveData();
                }
            },

            getAllExercises: function() {
                return Array.from(new Set([...this.dbExercises, ...this.state.customExercises])).sort();
            },

            // --- STATISTIQUES ET PREDICTIONS ---
            getExerciseStats: function(exName, targetReps) {
                const history = this.state.history.filter(h => h.exercise === exName);
                if (history.length === 0) return { last: null, suggestedWeight: null };

                // Dernière performance
                history.sort((a,b) => b.timestamp - a.timestamp);
                const last = history[0];

                // Calcul du 1RM max historique (Brzycki)
                let max1RM = 0;
                history.forEach(h => {
                    let rm = h.weight * (36 / (37 - h.reps));
                    if(rm > max1RM) max1RM = rm;
                });

                // Poids suggéré pour atteindre les reps cibles (Brzycki inversé)
                let suggestedWeight = max1RM / (36 / (37 - targetReps));
                suggestedWeight = Math.round(suggestedWeight * 2) / 2; // Arrondi à 0.5kg près

                return { last, suggestedWeight, max1RM: Math.round(max1RM) };
            },

            nav: {
                init: function() { app.ui.populateExerciseSelects(); },
                switch: function(viewId, navElement) {
                    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
                    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
                    document.getElementById(viewId).classList.add('active');
                    navElement.classList.add('active');
                    if(viewId === 'view-dashboard') app.updateChart();
                }
            },

            ui: {
                populateExerciseSelects: function() {
                    const select = document.getElementById('rb-ex-select');
                    select.innerHTML = '';
                    app.getAllExercises().forEach(ex => {
                        select.innerHTML += `<option value="${ex}">${ex}</option>`;
                    });
                },
                renderDashboard: function() {
                    const uniqueDates = new Set(app.state.history.map(h => h.date));
                    document.getElementById('kpi-sessions').textContent = uniqueDates.size;
                    const vol = app.state.history.reduce((sum, item) => sum + (item.weight * item.reps * item.sets), 0);
                    document.getElementById('kpi-volume').textContent = vol.toLocaleString('fr-FR');
                },
                renderRoutines: function() {
                    const container = document.getElementById('routines-list');
                    container.innerHTML = '';
                    app.state.routines.forEach(rt => {
                        container.innerHTML += `
                            <div class="list-item" onclick="app.modals.activeWorkout.open('${rt.id}')">
                                <div class="list-item-content">
                                    <h4>${rt.name}</h4>
                                    <p>${rt.exercises.length} exercices</p>
                                </div>
                                <i class="fas fa-play" style="color:var(--primary); font-size:1.5rem;"></i>
                            </div>
                        `;
                    });
                },
                renderHistory: function() {
                    const container = document.getElementById('history-feed');
                    container.innerHTML = '';
                    const recent = [...app.state.history].sort((a,b) => b.timestamp - a.timestamp).slice(0, 30);
                    if (recent.length === 0) {
                        container.innerHTML = '<p style="color:var(--text-muted);">Aucune série.</p>';
                        return;
                    }
                    recent.forEach(item => {
                        const d = new Date(item.date);
                        container.innerHTML += `
                            <div class="history-card">
                                <div class="history-header">
                                    <span class="history-date">${d.getDate()}/${d.getMonth()+1} - ${item.exercise}</span>
                                    <button style="background:none; border:none; color:var(--danger);" onclick="app.dataManager.deleteRecord('${item.id}')"><i class="fas fa-trash"></i></button>
                                </div>
                                <div><strong>${item.sets} x ${item.reps} @ ${item.weight}kg</strong> (RPE ${item.rpe || '-'})</div>
                            </div>
                        `;
                    });
                }
            },

            updateUI: function() {
                this.ui.renderDashboard();
                this.ui.renderRoutines();
                this.ui.renderHistory();
                this.ui.populateExerciseSelects();
            },

            modals: {
                routineBuilder: {
                    tempExercises: [],
                    open: function() {
                        this.tempExercises = [];
                        document.getElementById('rb-name').value = '';
                        this.renderList();
                        document.getElementById('modal-routine-builder').classList.add('open');
                    },
                    close: function() { document.getElementById('modal-routine-builder').classList.remove('open'); },
                    addExercise: function() {
                        const ex = {
                            name: document.getElementById('rb-ex-select').value,
                            sets: parseInt(document.getElementById('rb-ex-sets').value),
                            targetReps: parseInt(document.getElementById('rb-ex-targetreps').value),
                            restSets: parseInt(document.getElementById('rb-ex-restsets').value),
                            restExercise: parseInt(document.getElementById('rb-ex-restex').value)
                        };
                        this.tempExercises.push(ex);
                        this.renderList();
                    },
                    removeExercise: function(idx) {
                        this.tempExercises.splice(idx, 1);
                        this.renderList();
                    },
                    renderList: function() {
                        document.getElementById('rb-exercises-list').innerHTML = this.tempExercises.map((ex, i) => `
                            <div style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--border);">
                                <div>
                                    <strong>${ex.name}</strong><br>
                                    <small>${ex.sets}x${ex.targetReps} | Repos: ${ex.restSets}s / ${ex.restExercise}s</small>
                                </div>
                                <i class="fas fa-times" style="color:var(--danger); padding:10px;" onclick="app.modals.routineBuilder.removeExercise(${i})"></i>
                            </div>
                        `).join('');
                    },
                    save: function() {
                        const name = document.getElementById('rb-name').value.trim();
                        if (!name || this.tempExercises.length === 0) return alert('Nom et exercices requis.');
                        app.state.routines.push({ id: 'rt_' + Date.now(), name: name, exercises: [...this.tempExercises] });
                        app.saveData();
                        app.updateUI();
                        this.close();
                    }
                },

                activeWorkout: {
                    currentRoutine: null,
                    sessionData: [],
                    open: function(routineId) {
                        this.currentRoutine = app.state.routines.find(r => r.id === routineId);
                        this.sessionData = [];
                        document.getElementById('aw-title').textContent = this.currentRoutine.name;
                        this.renderRunner();
                        document.getElementById('modal-active-workout').classList.add('open');
                    },
                    confirmClose: function() {
                        if(confirm("Quitter sans sauvegarder ?")) document.getElementById('modal-active-workout').classList.remove('open');
                    },
                    renderRunner: function() {
                        const container = document.getElementById('aw-body');
                        container.innerHTML = '';

                        this.currentRoutine.exercises.forEach((ex, exIdx) => {
                            const stats = app.getExerciseStats(ex.name, ex.targetReps);
                            
                            let hintHtml = '';
                            if(stats.last) {
                                hintHtml = `
                                    <div class="exercise-hints">
                                        <i class="fas fa-history"></i> Dernière séance: <strong>${stats.last.weight}kg x ${stats.last.reps}</strong><br>
                                        <i class="fas fa-bullseye"></i> Objectif estimé (${ex.targetReps} reps): <strong>${stats.suggestedWeight}kg</strong>
                                    </div>
                                `;
                            } else {
                                hintHtml = `<div class="exercise-hints"><i class="fas fa-info-circle"></i> Nouveau mouvement.</div>`;
                            }

                            let rowsHtml = '';
                            for(let i=0; i<ex.sets; i++) {
                                let prefillWeight = stats.suggestedWeight || '';
                                let prefillReps = ex.targetReps || '';
                                rowsHtml += `
                                    <div class="set-row" id="row-${exIdx}-${i}">
                                        <div class="set-number">${i+1}</div>
                                        <input type="number" step="0.5" placeholder="kg" id="w-${exIdx}-${i}" value="${prefillWeight}">
                                        <input type="number" placeholder="reps" id="r-${exIdx}-${i}" value="${prefillReps}">
                                        <input type="number" placeholder="rpe" id="rpe-${exIdx}-${i}">
                                        <button class="btn-check-set" onclick="app.modals.activeWorkout.checkSet(${exIdx}, ${i})">
                                            <i class="fas fa-check"></i>
                                        </button>
                                    </div>
                                `;
                            }

                            container.innerHTML += `
                                <div class="active-exercise-card">
                                    <h3 style="margin-bottom: 10px; color:var(--primary);">${ex.name}</h3>
                                    ${hintHtml}
                                    <div style="font-size:0.8rem; color:var(--text-muted); display:grid; grid-template-columns:35px 1fr 1fr 1fr 45px; gap:8px; margin-bottom:5px; text-align:center;">
                                        <span>Set</span><span>Kg</span><span>Reps</span><span>RPE</span><span></span>
                                    </div>
                                    ${rowsHtml}
                                </div>
                            `;
                        });
                    },
                    checkSet: function(exIdx, setIdx) {
                        const ex = this.currentRoutine.exercises[exIdx];
                        const weight = parseFloat(document.getElementById(`w-${exIdx}-${setIdx}`).value);
                        const reps = parseInt(document.getElementById(`r-${exIdx}-${setIdx}`).value);
                        const rpe = parseInt(document.getElementById(`rpe-${exIdx}-${setIdx}`).value) || null;
                        
                        if(isNaN(weight) || isNaN(reps)) return alert("Saisir poids et reps.");

                        this.sessionData.push({
                            id: 'set_' + Date.now() + Math.random().toString(16).slice(2),
                            date: new Date().toISOString().split('T')[0],
                            timestamp: Date.now(),
                            exercise: ex.name,
                            sets: 1, reps: reps, weight: weight, rpe: rpe
                        });

                        const btn = document.querySelector(`#row-${exIdx}-${setIdx} .btn-check-set`);
                        btn.classList.add('done');
                        btn.innerHTML = '<i class="fas fa-check-double"></i>';
                        btn.disabled = true;

                        // Lancement du chrono dynamique
                        const isLastSet = (setIdx === ex.sets - 1);
                        const restTime = isLastSet ? ex.restExercise : ex.restSets;
                        app.timer.start(restTime);
                    },
                    finishWorkout: function() {
                        if(this.sessionData.length === 0) return alert("Aucune série validée.");
                        app.state.history.push(...this.sessionData);
                        app.saveData();
                        app.updateUI();
                        document.getElementById('modal-active-workout').classList.remove('open');
                        app.nav.switch('view-dashboard', document.querySelector('.nav-item'));
                        app.timer.stop();
                    }
                },
                settings: {
                    open: function() { document.getElementById('modal-settings').classList.add('open'); },
                    close: function() { document.getElementById('modal-settings').classList.remove('open'); }
                }
            },

            // --- CHRONOMETRE ---
            timer: {
                start: function(duration) {
                    const timerEl = document.getElementById('floating-timer');
                    const display = document.getElementById('ft-display');
                    
                    app.timeLeft = duration;
                    timerEl.classList.add('active');
                    timerEl.style.background = 'var(--secondary)';
                    
                    if(app.timerInterval) clearInterval(app.timerInterval);
                    
                    const updateDisplay = () => {
                        const m = Math.floor(app.timeLeft / 60).toString().padStart(2, '0');
                        const s = (app.timeLeft % 60).toString().padStart(2, '0');
                        display.textContent = `${m}:${s}`;
                    };
                    updateDisplay();

                    app.timerInterval = setInterval(() => {
                        app.timeLeft--;
                        updateDisplay();
                        
                        if(app.timeLeft <= 10) timerEl.style.background = 'var(--accent)';
                        if(app.timeLeft <= 0) {
                            clearInterval(app.timerInterval);
                            timerEl.style.background = 'var(--success)';
                            display.textContent = "GO!";
                            try {
                                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                                const osc = ctx.createOscillator();
                                osc.connect(ctx.destination);
                                osc.frequency.value = 600;
                                osc.start();
                                osc.stop(ctx.currentTime + 0.5);
                            } catch(e) {}
                            setTimeout(() => timerEl.classList.remove('active'), 3000);
                        }
                    }, 1000);
                },
                stop: function() {
                    if(app.timerInterval) clearInterval(app.timerInterval);
                    document.getElementById('floating-timer').classList.remove('active');
                },
                toggle: function() {
                    if(app.timeLeft > 0) app.timeLeft += 30;
                    else this.stop();
                }
            },

            // --- GRAPHIQUE ---
            initChart: function() {
                const ctx = document.getElementById('mainChart').getContext('2d');
                Chart.defaults.color = '#a0a0a0';
                this.chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels: [], datasets: [] },
                    options: {
                        responsive: true, maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            x: { grid: { color: 'rgba(255,255,255,0.05)' } },
                            y: { grid: { color: 'rgba(255,255,255,0.05)' } }
                        }
                    }
                });
                this.updateChart();
            },
            updateChart: function() {
                if(!this.chartInstance || this.state.history.length === 0) return;
                const sorted = [...this.state.history].sort((a,b) => new Date(a.date) - new Date(b.date));
                const allDates = Array.from(new Set(sorted.map(h => h.date)));
                
                const filter = document.getElementById('chart-filter').value;
                let targets = filter === 'all' ? Array.from(new Set(sorted.map(s=>s.exercise))).slice(0,3) : [filter];
                
                this.chartInstance.data.labels = allDates.map(d => d.slice(5).replace('-','/'));
                this.chartInstance.data.datasets = targets.map((ex, i) => {
                    const color = ['#bb86fc', '#03dac6', '#ffb74d'][i%3];
                    return {
                        label: ex, borderColor: color, backgroundColor: color,
                        data: allDates.map(d => {
                            const entries = sorted.filter(x => x.date === d && x.exercise === ex);
                            if(entries.length === 0) return null;
                            return Math.max(...entries.map(e => e.weight * (36/(37-e.reps)))).toFixed(1);
                        }),
                        spanGaps: true
                    }
                });
                this.chartInstance.update();
            },

            dataManager: {
                deleteRecord: function(id) {
                    app.state.history = app.state.history.filter(h => h.id !== id);
                    app.saveData(); app.updateUI();
                },
                clearAll: function() {
                    app.state = { history: [], routines: [], customExercises: [] };
                    app.ensureDefaultRoutines(); app.updateUI();
                },
                export: function() {
                    const a = document.createElement('a');
                    a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(app.state));
                    a.download = "titantrack_smart.json";
                    a.click();
                },
                import: function(e) {
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        app.state = JSON.parse(ev.target.result);
                        app.saveData(); app.updateUI();
                    };
                    reader.readAsText(e.target.files[0]);
                }
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
